name: render

# ============================================================
# ZERO-WASTE RENDER POLICY (LOCKED — human decision, do not override silently)
#
# We are NOT allowed to render an already-existing video when we
# render a new one. We only render an episode when we THINK WE
# NEED TO CHANGE THE VIDEO:
#   - a source edit for that specific episode,
#   - a shared source change (chrome/theme) we decide warrants a re-render,
#   - a new episode registered in episodes.json,
#   - or an explicit manual workflow_dispatch re-render decision.
#
# Finished episodes are NEVER re-rendered implicitly. A push that
# touches nothing relevant to finished episodes must not trigger
# their re-render. Manual dispatch with an explicit episode choice
# is the deliberate escape hatch.
# ============================================================

on:
  workflow_dispatch:
    inputs:
      episode:
        description: "Which episode to render (manual dispatch = deliberate re-render decision)"
        type: choice
        default: none
        options: [none, all, ep01, ep02, ep03, ep04, ep05, wifi, wifi-film, littlebit, littlebit-film, training-memory, fp4-format, diffusion-llm, kv-cache, activation-checkpointing, bf16, moe-active, flash-attention, tokenizer-tax, speculative-acceptance, attention-sink, gqa, moe-router, quant-aware-training]
      episodes:
        description: "Comma-separated episode keys to render in ONE run (overrides 'episode')"
        type: string
        default: ""
  push:
    branches: [main]
    paths:
      - "video/**"
      - ".github/workflows/render.yml"

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Resolve episodes.json into a matrix so adding an episode is a data change,
  # not a workflow rewrite. Two parallel jobs, each ~6 minutes.
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      count: ${{ steps.build.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The changed-file diff needs both push SHAs in history.
          fetch-depth: 0
      - id: build
        env:
          WANT: ${{ github.event.inputs.episode || 'none' }}
          MULTI: ${{ github.event.inputs.episodes || '' }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          node -e '
            const all = require("./video/episodes.json");
            const { execSync } = require("child_process");

            const emit = (keys, reason) => {
              const include = keys.map((k) => ({ key: k, ...all[k] }));
              console.error("plan reason: " + reason);
              console.log("matrix=" + JSON.stringify({ include }));
              console.log("count=" + include.length);
            };

            const want = (process.env.WANT || "none").trim();
            const multi = (process.env.MULTI || "").trim();
            const event = process.env.EVENT || "";
            const before = (process.env.BEFORE || "").trim();
            const after = (process.env.AFTER || "").trim();
            const isZero = (s) => !s || /^0+$/.test(s);

            // ---- manual dispatch: explicit, deliberate choice ----
            // A comma-separated list renders exactly those episodes in ONE run.
            // This matters: the concurrency group cancels a previous run on the
            // same ref, so dispatching fourteen times in a row would cancel
            // thirteen of them, and "all" would re-render finished videos.
            if (multi) {
              const keys = multi.split(",").map((s) => s.trim()).filter(Boolean);
              const bad = keys.filter((k) => !all[k]);
              if (bad.length) {
                console.error("unknown episode(s): " + bad.join(", "));
                process.exit(1);
              }
              emit(keys, "dispatch:" + keys.join(","));
            } else if (event === "workflow_dispatch") {
              if (want === "none") {
                emit([], "dispatch:none");
              } else if (want === "all") {
                emit(Object.keys(all), "dispatch:all");
              } else if (!all[want]) {
                console.error("unknown episode: " + want);
                process.exit(1);
              } else {
                emit([want], "dispatch:" + want);
              }
            } else {
              // ---- push: render only what the diff says changed ----
              let changed = [];
              if (!isZero(before) && !isZero(after)) {
                try {
                  changed = execSync(`git diff --name-only ${before} ${after}`, { encoding: "utf-8", stdio: ["pipe", "pipe", "pipe"] }).trim().split("\n").filter(Boolean);
                } catch (e) {
                  changed = [];
                }
              }

              if (changed.length === 0) {
                // ZERO-WASTE RENDER POLICY: no file diff -> render nothing.
                emit([], "push:no-file-diff");
              } else {
                // Shared files that affect every episode.
                // ONLY tts.py belongs here: it writes the wavs and the measured
                // timings, so changing it changes every render. audit.py and
                // gdrive_upload.py are gates/plumbing — a change there must not
                // re-render eight finished videos.
                const sharedPatterns = ["video/src/chrome", "video/src/theme", "video/tools/tts.py"];
                const episodesJsonChanged = changed.includes("video/episodes.json");

                // If episodes.json changed, determine which episodes are new or modified.
                let oldEpisodes = {};
                if (episodesJsonChanged && !isZero(before)) {
                  try {
                    oldEpisodes = JSON.parse(execSync(`git show ${before}:video/episodes.json`, { encoding: "utf-8", stdio: ["pipe", "pipe", "pipe"] }));
                  } catch (e) {
                    oldEpisodes = {};
                  }
                }

                // A file can sit inside more than one srcDir (the film lives
                // under src/wifi/film, inside the short srcDir src/wifi). The
                // most specific srcDir owns it, so a film edit never re-renders
                // the short, and a short edit never renders the film.
                const owner = (file) => {
                  let best = null;
                  for (const k of Object.keys(all)) {
                    const prefix = "video/" + all[k].srcDir + "/";
                    if (file.startsWith(prefix) && (!best || prefix.length > best.len)) {
                      best = { key: k, len: prefix.length };
                    }
                  }
                  return best ? best.key : null;
                };
                const owners = (files) => [...new Set(files.map(owner).filter(Boolean))];

                let keys;
                if (episodesJsonChanged) {
                  const newEps = Object.keys(all).filter((k) => !oldEpisodes[k]);
                  keys = [...new Set([...newEps, ...owners(changed)])];
                } else if (changed.some((f) => sharedPatterns.some((p) => f.startsWith(p)))) {
                  // Shared code changed -> the explicit "we need to change the videos" signal.
                  keys = Object.keys(all);
                } else {
                  keys = owners(changed);
                }

                emit(keys, keys.length ? "push:" + keys.join(",") : "push:nothing-relevant");
              }
            }
          ' >> "$GITHUB_OUTPUT"

  render:
    needs: plan
    # ZERO-WASTE: skip the whole job when the plan resolved to zero episodes.
    if: needs.plan.outputs.count != '' && needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      SRC_DIR: ${{ matrix.srcDir }}
      AUDIO_DIR: ${{ matrix.audioDir }}
      COMPOSITION: ${{ matrix.composition }}
      OUTPUT: ${{ matrix.output }}
      TITLE: ${{ matrix.title }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: video/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Stdlib-only gate: fail in seconds, not after a 7-minute render.
      # Catches crossed-file contradictions (slate vs narration) that each
      # look correct in isolation. Placed after setup-python so `python` exists.
      - name: Audit (pre-flight)
        working-directory: video
        run: python tools/audit.py --static

      - name: System packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            ffmpeg espeak-ng libsndfile1 \
            libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libgbm-dev \
            libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 \
            libxdamage1 libpango-1.0-0 libcairo2 libcups2 fonts-liberation

      - name: Cache Kokoro model
        uses: actions/cache@v4
        with:
          path: |
            video/kokoro-v1.0.onnx
            video/voices-v1.0.bin
          key: kokoro-v1.0-model-files-v1.1

      - name: Download Kokoro model
        working-directory: video
        run: |
          BASE=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1
          [ -f kokoro-v1.0.onnx ] || curl -L --retry 3 -o kokoro-v1.0.onnx "$BASE/kokoro-v1.0.onnx"
          [ -f voices-v1.0.bin ] || curl -L --retry 3 -o voices-v1.0.bin "$BASE/voices-v1.0.bin"
          ls -lh kokoro-v1.0.onnx voices-v1.0.bin

      - name: Install TTS dependencies
        run: pip install -q kokoro-onnx soundfile numpy google-api-python-client google-auth

      - name: Install node dependencies
        working-directory: video
        run: npm ci --no-audit --no-fund

      - name: Generate narration
        working-directory: video
        run: python tools/tts.py --src-dir "$SRC_DIR" --audio-dir "$AUDIO_DIR"

      - name: Ensure headless browser
        working-directory: video
        run: npx remotion browser ensure

      - name: Render episode
        working-directory: video
        run: |
          START=$(date +%s)
          npx remotion render "$COMPOSITION" "out/$OUTPUT"
          END=$(date +%s)
          echo "RENDER_SECONDS=$((END-START))" >> "$GITHUB_ENV"

      - name: Master audio to -14 LUFS
        working-directory: video
        run: |
          ffmpeg -y -v error -i "out/$OUTPUT" \
            -c:v copy \
            -af "loudnorm=I=-14:TP=-1.5:LRA=11" \
            -ar 48000 -c:a aac -b:a 192k \
            -movflags +faststart \
            "out/master.mp4"
          mv "out/master.mp4" "out/$OUTPUT"
          echo "--- integrated loudness ---"
          ffmpeg -hide_banner -nostats -i "out/$OUTPUT" \
            -af ebur128 -f null - 2>&1 | grep -A6 "Summary:" | head -12

      - name: Verify output
        working-directory: video
        run: |
          ffprobe -v error -show_entries format=duration,size,bit_rate \
            -show_entries stream=codec_type,codec_name,width,height,r_frame_rate,pix_fmt \
            -of default=noprint_wrappers=1 "out/$OUTPUT"
          ls -lh "out/$OUTPUT"
          DUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "out/$OUTPUT")
          AUDIO=$(ffprobe -v error -select_streams a -show_entries stream=codec_name -of csv=p=0 "out/$OUTPUT")
          DIMS=$(ffprobe -v error -select_streams v -show_entries stream=width,height -of csv=p=0 "out/$OUTPUT")
          echo "HEARD_AUDIO=${AUDIO:-none}" >> "$GITHUB_ENV"
          echo "DURATION=${DUR}" >> "$GITHUB_ENV"
          echo "DIMS=${DIMS}" >> "$GITHUB_ENV"
          if [ "${DIMS}" != "1920,1080" ] && [ "${DIMS}" != "1080,1920" ]; then
            echo "::error::expected 1920x1080 or 1080x1920, got ${DIMS}"
            exit 1
          fi

      - name: Fail if silent
        run: |
          if [ -z "${HEARD_AUDIO}" ]; then
            echo "::error::Rendered video has no audio stream"
            exit 1
          fi

      # Full gate on the finished file: resolution, codec, timeline-vs-duration,
      # loudness, and all static checks against the freshly generated wavs.
      # Nothing reaches Drive unless this passes.
      - name: Audit (render)
        working-directory: video
        run: python tools/audit.py --static --video "out/$OUTPUT" --episode "${{ matrix.key }}"

      # Pull one frame out of the file that just passed the gate — no second
      # render, no second bundle. YouTube's custom-thumbnail slot is 1280x720
      # JPEG <2 MB, so a vertical episode (1080x1920) is centred over a blurred
      # fill and also kept in its native phone shape for the Shorts listing.
      - name: Extract thumbnail
        working-directory: video
        run: |
          STEM="${OUTPUT%.mp4}"
          W=$(ffprobe -v error -select_streams v -show_entries stream=width -of csv=p=0 "out/$OUTPUT")
          H=$(ffprobe -v error -select_streams v -show_entries stream=height -of csv=p=0 "out/$OUTPUT")
          SECS="${{ matrix.thumbSeconds }}"
          SECS="${SECS:-4}"
          DUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "out/$OUTPUT")
          SECS=$(awk -v s="$SECS" -v d="$DUR" 'BEGIN { print (s > d - 1 ? d / 2 : s) }')
          echo "thumbnail at ${SECS}s of ${DUR}s (${W}x${H})"

          ffmpeg -y -v error -ss "$SECS" -i "out/$OUTPUT" -frames:v 1 -update 1 "out/${STEM}-frame.png"

          make_16x9() {  # $1 frame, $2 out, $3 qscale
            if [ "$W" -gt "$H" ]; then
              ffmpeg -y -v error -i "$1" -vf "scale=1280:720:flags=lanczos" -q:v "$3" "$2"
            else
              # Blur hard and dim the fill, or the vertical frame's own text
              # ghosts across the sides and reads as a mistake.
              ffmpeg -y -v error -i "$1" -filter_complex \
                "[0:v]scale=1280:720:force_original_aspect_ratio=increase,crop=1280:720,gblur=sigma=60,eq=brightness=-0.22:saturation=1.25[bg];[0:v]scale=-2:720[fg];[bg][fg]overlay=(W-w)/2:(H-h)/2" \
                -q:v "$3" "$2"
            fi
          }

          make_16x9 "out/${STEM}-frame.png" "out/${STEM}-thumbnail.jpg" 3
          BYTES=$(stat -c%s "out/${STEM}-thumbnail.jpg")
          if [ "$BYTES" -gt 2000000 ]; then
            echo "thumbnail is ${BYTES} bytes, over the 2 MB upload limit; re-encoding"
            make_16x9 "out/${STEM}-frame.png" "out/${STEM}-thumbnail.jpg" 7
            BYTES=$(stat -c%s "out/${STEM}-thumbnail.jpg")
          fi

          THUMB_9X16=""
          if [ "$H" -gt "$W" ]; then
            THUMB_9X16="out/${STEM}-thumbnail-9x16.jpg"
            ffmpeg -y -v error -i "out/${STEM}-frame.png" -vf "scale=1080:1920:flags=lanczos" -q:v 3 "$THUMB_9X16"
          fi
          rm -f "out/${STEM}-frame.png"

          echo "THUMB_16X9=out/${STEM}-thumbnail.jpg" >> "$GITHUB_ENV"
          echo "THUMB_9X16=${THUMB_9X16}" >> "$GITHUB_ENV"
          ls -lh out/*thumbnail*.jpg
          echo "| thumbnail | ${BYTES} bytes |" >> "$GITHUB_STEP_SUMMARY"

      - name: Generate subtitles
        working-directory: video
        run: |
          # Built from the MEASURED timings that tts.py wrote, so the captions
          # land exactly on the narration. YouTube's auto-captions get this
          # channel's terminology wrong, and the terminology is the point.
          STEM="${OUTPUT%.mp4}"
          python tools/make_srt.py --episode "${{ matrix.key }}" --out "out/${STEM}.srt" \
            || echo "::warning::srt generation failed for ${{ matrix.key }}"
          ls -lh out/*.srt 2>/dev/null || true

      - name: Upload to Google Drive
        if: success()
        working-directory: video
        env:
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_SHORTS_FOLDER_ID: ${{ secrets.GDRIVE_SHORTS_FOLDER_ID }}
          GDRIVE_SHORTS_MAX_SECONDS: "180"
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
          # The dated folder carries the PUBLISH date, not the render date. A
          # whole week of shorts renders in one run, so every folder would
          # otherwise land on the same day. Empty -> today.
          GDRIVE_DATE: ${{ matrix.publishDate }}
        run: |
          ARGS=()
          if [ -n "${THUMB_16X9}" ]; then ARGS+=(--thumb "${THUMB_16X9}"); fi
          if [ -n "${THUMB_9X16}" ]; then ARGS+=(--thumb "${THUMB_9X16}"); fi
          STEM="${OUTPUT%.mp4}"
          if [ -f "out/${STEM}.srt" ]; then ARGS+=(--thumb "out/${STEM}.srt"); fi
          python tools/gdrive_upload.py "out/$OUTPUT" --name "$OUTPUT" "${ARGS[@]}"

      - name: Run summary
        if: always()
        run: |
          {
            echo "### $TITLE"
            echo ""
            echo "| field | value |"
            echo "|---|---|"
            echo "| episode | \`${{ matrix.key }}\` |"
            echo "| composition | \`$COMPOSITION\` |"
            echo "| file | \`$OUTPUT\` |"
            echo "| duration | ${DURATION:-?}s |"
            echo "| resolution | ${DIMS:-?} |"
            echo "| audio | ${HEARD_AUDIO:-NONE} |"
            echo "| render wall clock | ${RENDER_SECONDS:-?}s |"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.key }}-${{ matrix.output }}
          path: |
            video/out/${{ matrix.output }}
            video/out/*-thumbnail*.jpg
            video/out/*.srt
            video/${{ matrix.audioDir }}/*.wav
            video/${{ matrix.srcDir }}/timings.json
          retention-days: 30
