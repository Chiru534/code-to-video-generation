name: render

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "video/**"
      - ".github/workflows/render.yml"

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: video/package-lock.json

      - name: Chrome shared libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            ffmpeg \
            libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libgbm-dev \
            libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 \
            libxdamage1 libpango-1.0-0 libcairo2 libcups2 fonts-liberation

      - name: Install dependencies
        working-directory: video
        run: npm ci --no-audit --no-fund

      - name: Ensure headless browser
        working-directory: video
        run: npx remotion browser ensure

      - name: Render episode
        working-directory: video
        run: |
          START=$(date +%s)
          npx remotion render FindingTheAddress out/finding-the-address.mp4
          END=$(date +%s)
          echo "RENDER_SECONDS=$((END-START))" >> "$GITHUB_ENV"

      - name: Verify output
        working-directory: video
        run: |
          ffprobe -v error -show_entries format=duration,size,bit_rate \
            -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt \
            -of default=noprint_wrappers=1 out/finding-the-address.mp4
          ls -lh out/finding-the-address.mp4
          FPS=$(python3 -c "print(round(3600/${RENDER_SECONDS},2))")
          PROJ=$(python3 -c "print(round(27000/${FPS}/60,1))")
          {
            echo "### Episode render"
            echo ""
            echo "| metric | value |"
            echo "|---|---|"
            echo "| wall clock | ${RENDER_SECONDS}s |"
            echo "| frames | 3600 (120s @ 30fps) |"
            echo "| throughput | ${FPS} frames/sec |"
            echo "| projected 15 min | ${PROJ} min sequential |"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: finding-the-address
          path: video/out/finding-the-address.mp4
          retention-days: 30
