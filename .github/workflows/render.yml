name: render

on:
  workflow_dispatch:
    inputs:
      episode:
        description: "Which episode to render"
        type: choice
        default: all
        options: [all, ep01, ep02]
  push:
    branches: [main]
    paths:
      - "video/**"
      - ".github/workflows/render.yml"

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Resolve episodes.json into a matrix so adding an episode is a data change,
  # not a workflow rewrite. Two parallel jobs, each ~6 minutes.
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: build
        env:
          WANT: ${{ github.event.inputs.episode || 'all' }}
        run: |
          node -e '
            const all = require("./video/episodes.json");
            const { execSync } = require("child_process");
            const want = process.env.WANT || "all";

            // Manual trigger: explicit selection
            if (want !== "all") {
              const keys = want === "all" ? Object.keys(all) : [want];
              for (const k of keys) {
                if (!all[k]) { console.error("unknown episode: " + k); process.exit(1); }
              }
              const include = keys.map((k) => ({ key: k, ...all[k] }));
              console.log("matrix=" + JSON.stringify({ include }));
              process.exit(0);
            }

            // Push trigger: selective rendering based on changed files
            let changed = [];
            try {
              changed = execSync("git diff --name-only HEAD~1 HEAD", { encoding: "utf-8", stdio: ["pipe", "pipe", "pipe"] }).trim().split("\n").filter(Boolean);
            } catch (e) {
              changed = [];
            }

            // No changed files detected (first commit, shallow clone, etc.) -> render all
            if (changed.length === 0) {
              const keys = Object.keys(all);
              const include = keys.map((k) => ({ key: k, ...all[k] }));
              console.log("matrix=" + JSON.stringify({ include }));
              process.exit(0);
            }

            // Shared files that affect every episode
            const sharedPatterns = ["video/src/chrome", "video/src/theme", "video/tools/"];
            const episodesJsonChanged = changed.includes("video/episodes.json");

            // If episodes.json changed, determine which episodes are new or modified
            let oldEpisodes = {};
            if (episodesJsonChanged) {
              try {
                const old = execSync("git show HEAD~1:video/episodes.json", { encoding: "utf-8", stdio: ["pipe", "pipe", "pipe"] });
                oldEpisodes = JSON.parse(old);
              } catch (e) {
                oldEpisodes = {};
              }
            }

            let keys;
            if (episodesJsonChanged) {
              // New episodes + episodes with changed source files
              const newEps = Object.keys(all).filter(k => !oldEpisodes[k]);
              const changedEps = Object.keys(all).filter(k => {
                const srcDir = all[k].srcDir;
                return changed.some(f => f.startsWith("video/" + srcDir + "/"));
              });
              keys = [...new Set([...newEps, ...changedEps])];
            } else if (changed.some(f => sharedPatterns.some(p => f.startsWith(p)))) {
              // Shared code changed -> render all
              keys = Object.keys(all);
            } else {
              // Only specific episode source files changed
              keys = Object.keys(all).filter(k => {
                const srcDir = all[k].srcDir;
                return changed.some(f => f.startsWith("video/" + srcDir + "/"));
              });
            }

            // If no episodes changed (e.g. workflow-only or docs-only change), skip rendering
            if (keys.length === 0) {
              console.log("matrix=" + JSON.stringify({ include: [] }));
              process.exit(0);
            }

            const include = keys.map((k) => ({ key: k, ...all[k] }));
            console.log("matrix=" + JSON.stringify({ include }));
          ' >> "$GITHUB_OUTPUT"

  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      SRC_DIR: ${{ matrix.srcDir }}
      AUDIO_DIR: ${{ matrix.audioDir }}
      COMPOSITION: ${{ matrix.composition }}
      OUTPUT: ${{ matrix.output }}
      TITLE: ${{ matrix.title }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: video/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Stdlib-only gate: fail in seconds, not after a 7-minute render.
      # Catches crossed-file contradictions (slate vs narration) that each
      # look correct in isolation. Placed after setup-python so `python` exists.
      - name: Audit (pre-flight)
        working-directory: video
        run: python tools/audit.py --static

      - name: System packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            ffmpeg espeak-ng libsndfile1 \
            libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libgbm-dev \
            libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 \
            libxdamage1 libpango-1.0-0 libcairo2 libcups2 fonts-liberation

      - name: Cache Kokoro model
        uses: actions/cache@v4
        with:
          path: |
            video/kokoro-v1.0.onnx
            video/voices-v1.0.bin
          key: kokoro-v1.0-model-files-v1.1

      - name: Download Kokoro model
        working-directory: video
        run: |
          BASE=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1
          [ -f kokoro-v1.0.onnx ] || curl -L --retry 3 -o kokoro-v1.0.onnx "$BASE/kokoro-v1.0.onnx"
          [ -f voices-v1.0.bin ] || curl -L --retry 3 -o voices-v1.0.bin "$BASE/voices-v1.0.bin"
          ls -lh kokoro-v1.0.onnx voices-v1.0.bin

      - name: Install TTS dependencies
        run: pip install -q kokoro-onnx soundfile numpy google-api-python-client google-auth

      - name: Install node dependencies
        working-directory: video
        run: npm ci --no-audit --no-fund

      - name: Generate narration
        working-directory: video
        run: python tools/tts.py --src-dir "$SRC_DIR" --audio-dir "$AUDIO_DIR"

      - name: Ensure headless browser
        working-directory: video
        run: npx remotion browser ensure

      - name: Render episode
        working-directory: video
        run: |
          START=$(date +%s)
          npx remotion render "$COMPOSITION" "out/$OUTPUT"
          END=$(date +%s)
          echo "RENDER_SECONDS=$((END-START))" >> "$GITHUB_ENV"

      - name: Master audio to -14 LUFS
        working-directory: video
        run: |
          ffmpeg -y -v error -i "out/$OUTPUT" \
            -c:v copy \
            -af "loudnorm=I=-14:TP=-1.5:LRA=11" \
            -ar 48000 -c:a aac -b:a 192k \
            -movflags +faststart \
            "out/master.mp4"
          mv "out/master.mp4" "out/$OUTPUT"
          echo "--- integrated loudness ---"
          ffmpeg -hide_banner -nostats -i "out/$OUTPUT" \
            -af ebur128 -f null - 2>&1 | grep -A6 "Summary:" | head -12

      - name: Verify output
        working-directory: video
        run: |
          ffprobe -v error -show_entries format=duration,size,bit_rate \
            -show_entries stream=codec_type,codec_name,width,height,r_frame_rate,pix_fmt \
            -of default=noprint_wrappers=1 "out/$OUTPUT"
          ls -lh "out/$OUTPUT"
          DUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "out/$OUTPUT")
          AUDIO=$(ffprobe -v error -select_streams a -show_entries stream=codec_name -of csv=p=0 "out/$OUTPUT")
          DIMS=$(ffprobe -v error -select_streams v -show_entries stream=width,height -of csv=p=0 "out/$OUTPUT")
          echo "HEARD_AUDIO=${AUDIO:-none}" >> "$GITHUB_ENV"
          echo "DURATION=${DUR}" >> "$GITHUB_ENV"
          echo "DIMS=${DIMS}" >> "$GITHUB_ENV"
          if [ "${DIMS}" != "1920,1080" ]; then
            echo "::error::expected 1920x1080, got ${DIMS}"
            exit 1
          fi

      - name: Fail if silent
        run: |
          if [ -z "${HEARD_AUDIO}" ]; then
            echo "::error::Rendered video has no audio stream"
            exit 1
          fi

      # Full gate on the finished file: resolution, codec, timeline-vs-duration,
      # loudness, and all static checks against the freshly generated wavs.
      # Nothing reaches Drive unless this passes.
      - name: Audit (render)
        working-directory: video
        run: python tools/audit.py --static --video "out/$OUTPUT" --episode "${{ matrix.key }}"

      - name: Upload to Google Drive
        if: success()
        working-directory: video
        env:
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_SHORTS_FOLDER_ID: ${{ secrets.GDRIVE_SHORTS_FOLDER_ID }}
          GDRIVE_SHORTS_MAX_SECONDS: "180"
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
        run: python tools/gdrive_upload.py "out/$OUTPUT" --name "$OUTPUT"

      - name: Run summary
        if: always()
        run: |
          {
            echo "### $TITLE"
            echo ""
            echo "| field | value |"
            echo "|---|---|"
            echo "| episode | \`${{ matrix.key }}\` |"
            echo "| composition | \`$COMPOSITION\` |"
            echo "| file | \`$OUTPUT\` |"
            echo "| duration | ${DURATION:-?}s |"
            echo "| resolution | ${DIMS:-?} |"
            echo "| audio | ${HEARD_AUDIO:-NONE} |"
            echo "| render wall clock | ${RENDER_SECONDS:-?}s |"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.key }}-${{ matrix.output }}
          path: |
            video/out/${{ matrix.output }}
            video/${{ matrix.audioDir }}/*.wav
            video/${{ matrix.srcDir }}/timings.json
          retention-days: 30
