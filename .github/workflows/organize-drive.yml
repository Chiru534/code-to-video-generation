name: Organize Drive folders

# Housekeeping for the Drive folders: sort them into dated per-video folders,
# give each video a thumbnail, and delete videos you name. It never renders
# anything, so it is safe to run by hand at any time.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Plan only, change nothing"
        type: boolean
        default: true
      delete_videos:
        description: "Videos to delete from the main folder (comma separated file names)"
        type: string
        default: ""
      delete_folder:
        description: "A whole subfolder of the main folder to delete as well"
        type: string
        default: ""
      delete_ids:
        description: "Exact file ids to delete (comma separated)"
        type: string
        default: ""
      restore_ids:
        description: "Exact trashed file ids to bring back (comma separated)"
        type: string
        default: ""
      rename_folder:
        description: "Rename a dated folder: OLD=NEW"
        type: string
        default: ""
      list_trash:
        description: "Just list what is in the Drive trash, change nothing"
        type: boolean
        default: false
      sort:
        description: "Run the folder sort and thumbnail pass"
        type: boolean
        default: true

jobs:
  organize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          pip install -q google-api-python-client google-auth requests

      - name: Delete videos
        if: ${{ inputs.delete_videos != '' || inputs.delete_folder != '' || inputs.delete_ids != '' || inputs.restore_ids != '' || inputs.list_trash || inputs.rename_folder != '' }}
        working-directory: video
        env:
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_SHORTS_FOLDER_ID: ${{ secrets.GDRIVE_SHORTS_FOLDER_ID }}
          DELETE_VIDEOS: ${{ inputs.delete_videos }}
          DELETE_FOLDER: ${{ inputs.delete_folder }}
          DELETE_IDS: ${{ inputs.delete_ids }}
          RESTORE_IDS: ${{ inputs.restore_ids }}
          RENAME_FOLDER: ${{ inputs.rename_folder }}
        run: |
          ARGS=()
          if [ -n "$RENAME_FOLDER" ]; then ARGS+=(--rename-folder "$RENAME_FOLDER"); fi
          add_ids() {  # $1 = comma separated ids, $2 = flag
            if [ -n "$1" ]; then
              IFS=',' read -ra LIST <<< "$1"
              for ITEM in "${LIST[@]}"; do
                ITEM="$(echo "$ITEM" | xargs)"
                if [ -n "$ITEM" ]; then ARGS+=("$2" "$ITEM"); fi
              done
            fi
          }
          if [ -n "$DELETE_VIDEOS" ]; then
            IFS=',' read -ra NAMES <<< "$DELETE_VIDEOS"
            for NAME in "${NAMES[@]}"; do
              NAME="$(echo "$NAME" | xargs)"
              if [ -n "$NAME" ]; then ARGS+=(--video "$NAME"); fi
            done
          fi
          if [ -n "$DELETE_FOLDER" ]; then ARGS+=(--also-folder "$DELETE_FOLDER"); fi
          add_ids "$DELETE_IDS" --file-id
          add_ids "$RESTORE_IDS" --restore-id
          if [ ${#ARGS[@]} -eq 0 ]; then
            echo "::warning::nothing named to delete"
            exit 0
          fi
          APPLY=""
          if [ "${{ inputs.dry_run }}" != "true" ]; then APPLY="--apply"; fi
          if [ "${{ inputs.list_trash }}" = "true" ]; then
            python tools/gdrive_delete.py --list-trash
            exit 0
          fi
          python tools/gdrive_delete.py --in main "${ARGS[@]}" $APPLY

      - name: Sort Drive into dated folders
        if: ${{ inputs.sort }}
        working-directory: video
        env:
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_SHORTS_FOLDER_ID: ${{ secrets.GDRIVE_SHORTS_FOLDER_ID }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "### dry run"
            python tools/gdrive_migrate.py --dry-run
          else
            echo "### applying"
            python tools/gdrive_migrate.py
          fi

      - name: Show the result
        if: always()
        working-directory: video
        env:
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_SHORTS_FOLDER_ID: ${{ secrets.GDRIVE_SHORTS_FOLDER_ID }}
        run: python tools/gdrive_migrate.py --list
